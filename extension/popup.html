<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SubMatch</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #141414;
      --text: #F1F1F1;
      --text-muted: #888;
      --text-hint: #555;
      --border: rgba(255,255,255,0.07);
      --btn-bg: #F1F1F1;
      --btn-text: #0F0F0F;
      --btn-hover: #D8D8D8;
      --select-bg: #222;
      --select-border: #333;
    }

    body.light-mode {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666;
      --text-hint: #999;
      --border: rgba(0,0,0,0.1);
      --btn-bg: #1a1a1a;
      --btn-text: #ffffff;
      --btn-hover: #333333;
      --select-bg: #f5f5f5;
      --select-border: #ddd;
    }

    body {
      width: 260px;
      padding: 24px 20px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
      transition: background-color 0.2s, color 0.2s;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      margin-bottom: 14px;
      object-fit: contain;
    }

    h2 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 7px;
    }

    p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 22px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      transition: background-color 0.15s ease, transform 0.1s ease;
      letter-spacing: 0.01em;
      margin-bottom: 16px;
    }

    .btn:hover {
      background-color: var(--btn-hover);
      transform: translateY(-1px);
    }

    .settings {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    select {
      background: var(--select-bg);
      color: var(--text);
      border: 1px solid var(--select-border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }

    .hint {
      font-size: 11px;
      color: var(--text-hint);
      margin-top: 16px;
      line-height: 1.4;
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 7px;
    }
    .top-row h2 { margin-bottom: 0; }
    .lang-switch {
      display: inline-flex;
      background: var(--select-bg);
      border: 1px solid var(--select-border);
      border-radius: 999px;
      padding: 2px;
      gap: 1px;
      flex-shrink: 0;
    }
    .lang-btn {
      appearance: none; border: none; background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: 999px; cursor: pointer;
      transition: background 0.15s, color 0.15s; line-height: 1;
    }
    .lang-btn:hover { color: var(--text); }
    .lang-btn.active { background: var(--btn-bg); color: var(--btn-text); }
  </style>
</head>
<body>
  <img src="icons/icon48.png" class="logo" alt="SubMatch" />

  <div class="top-row">
    <h2>SubMatch</h2>
    <div class="lang-switch" role="group" aria-label="Language">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="tr">TR</button>
    </div>
  </div>
  <p data-i18n="desc">Click any subtitle word while watching a video to translate and save it.</p>

  <button id="openWebBtn" class="btn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2 2 7l10 5 10-5-10-5z"/>
      <path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>
    </svg>
    <span data-i18n="myCards">My Flashcards</span>
  </button>

  <div class="divider"></div>

  <div class="settings">
    <div class="setting-row">
      <span data-i18n="theme">Theme</span>
      <select id="themeSelect">
        <option value="auto" data-i18n="sysOpt">System</option>
        <option value="dark" data-i18n="darkOpt">Dark</option>
        <option value="light" data-i18n="lightOpt">Light</option>
      </select>
    </div>
    <div class="setting-row">
      <span data-i18n="font">Font</span>
      <select id="fontSelect">
        <option value="system">System</option>
        <option value="sans">Sans-serif</option>
        <option value="serif">Serif</option>
        <option value="mono">Monospace</option>
      </select>
    </div>
    <div class="setting-row">
      <span data-i18n="underline">Underlines</span>
      <select id="underlineSelect">
        <option value="on" data-i18n="onOpt">On</option>
        <option value="off" data-i18n="offOpt">Off</option>
      </select>
    </div>
  </div>

  <p class="hint"><span data-i18n="hint">Works on YouTube, Netflix, Disney+, Amazon Prime &amp; more.</span></p>

  <script src="popup.js"></script>
</body>
</html>
