<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SubMatch</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 240px;
      padding: 24px 20px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #141414;
      color: #F1F1F1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      margin-bottom: 14px;
      object-fit: contain;
    }

    h2 {
      font-size: 17px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      margin-bottom: 7px;
    }

    p {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
      margin-bottom: 22px;
      padding: 0 4px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin-bottom: 18px;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 22px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease, transform 0.1s ease;
      letter-spacing: 0.01em;
    }

    .btn-primary {
      background-color: #F1F1F1;
      color: #0F0F0F;
    }

    .btn-primary:hover {
      background-color: #D8D8D8;
      transform: translateY(-1px);
    }

    .hint {
      font-size: 11px;
      color: #555;
      margin-top: 16px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <img src="icons/icon48.png" class="logo" alt="SubMatch" />

  <h2>SubMatch</h2>
  <p>Click any subtitle word while watching a video to translate and save it.</p>

  <div class="divider"></div>

  <button id="openWebBtn" class="btn btn-primary">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M2 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6z"/>
      <path d="M6 2h12a2 2 0 0 1 2 2v12" opacity="0.35"/>
    </svg>
    My Flashcards
  </button>

  <p class="hint">Works on YouTube, Netflix, Disney+, Amazon Prime, Vimeo &amp; more.</p>

  <script src="popup.js"></script>
</body>
</html>
