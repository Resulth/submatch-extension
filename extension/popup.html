<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SubMatch</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #141414;
      --text: #F1F1F1;
      --text-muted: #888;
      --text-hint: #555;
      --border: rgba(255,255,255,0.07);
      --btn-bg: #F1F1F1;
      --btn-text: #0F0F0F;
      --btn-hover: #D8D8D8;
      --select-bg: #222;
      --select-border: #333;
    }

    body.light-mode {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666;
      --text-hint: #999;
      --border: rgba(0,0,0,0.1);
      --btn-bg: #1a1a1a;
      --btn-text: #ffffff;
      --btn-hover: #333333;
      --select-bg: #f5f5f5;
      --select-border: #ddd;
    }

    body {
      width: 260px;
      padding: 18px 20px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
      transition: background-color 0.2s, color 0.2s;
    }

    .header-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    /* Web sitesindeki aynı şık Patreon butonu */
    .btn-patreon {
      background: linear-gradient(135deg, rgba(255, 66, 77, 0.12) 0%, rgba(255, 107, 107, 0.06) 100%);
      border: 1px solid rgba(255, 66, 77, 0.32);
      color: #FF6670;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2px;
      gap: 5px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(255, 66, 77, 0.08);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-patreon:hover {
      background: linear-gradient(135deg, rgba(255, 66, 77, 0.22) 0%, rgba(255, 107, 107, 0.12) 100%);
      border-color: rgba(255, 66, 77, 0.55);
      color: #FF7B84;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(255, 66, 77, 0.2);
    }
    body.light-mode .btn-patreon {
      background: linear-gradient(135deg, rgba(255, 66, 77, 0.08) 0%, rgba(255, 107, 107, 0.04) 100%);
      border: 1px solid rgba(255, 66, 77, 0.35);
      color: #D92B35;
      box-shadow: 0 2px 8px rgba(255, 66, 77, 0.06);
    }
    body.light-mode .btn-patreon:hover {
      background: linear-gradient(135deg, rgba(255, 66, 77, 0.15) 0%, rgba(255, 107, 107, 0.08) 100%);
      border-color: rgba(255, 66, 77, 0.6);
      color: #C71F29;
      box-shadow: 0 4px 14px rgba(255, 66, 77, 0.16);
    }

    .lang-switch {
      display: inline-flex;
      background: var(--select-bg);
      border: 1px solid var(--select-border);
      border-radius: 999px;
      padding: 2px;
      gap: 1px;
      flex-shrink: 0;
    }
    .lang-btn {
      appearance: none; border: none; background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: 999px; cursor: pointer;
      transition: background 0.15s, color 0.15s; line-height: 1;
    }
    .lang-btn:hover { color: var(--text); }
    .lang-btn.active { background: var(--btn-bg); color: var(--btn-text); }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      margin-bottom: 10px;
      object-fit: contain;
    }

    h2 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 22px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      transition: background-color 0.15s ease, transform 0.1s ease;
      letter-spacing: 0.01em;
      margin-bottom: 16px;
    }

    .btn:hover {
      background-color: var(--btn-hover);
      transform: translateY(-1px);
    }

    .settings {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    select {
      background: var(--select-bg);
      color: var(--text);
      border: 1px solid var(--select-border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }

    .hint {
      font-size: 11px;
      color: var(--text-hint);
      margin-top: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <!-- Üst Bar: En solda Support, en sağda EN/TR -->
  <div class="header-bar">
    <button id="patreonBtn" class="btn-patreon" type="button" title="Support on Patreon">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M22.995 13.05c-.01-5.696-4.613-10.31-10.31-10.32-5.698 0-10.32 4.623-10.32 10.32 0 5.69 4.622 10.31 10.32 10.31 1.14 0 2.242-.185 3.275-.526l-2.438-4.223a5.53 5.53 0 0 1-.837.065c-3.053 0-5.528-2.475-5.528-5.528 0-3.052 2.475-5.527 5.528-5.527 3.052 0 5.527 2.475 5.527 5.527 0 .548-.08 1.077-.23 1.577l4.78 2.76c.404-1.285.633-2.656.633-4.088z"/>
      </svg>
      <span data-i18n="patreonSupport">Support</span>
    </button>
    <div class="lang-switch" role="group" aria-label="Language">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="tr">TR</button>
    </div>
  </div>

  <img src="icons/icon48.png" class="logo" alt="SubMatch" />
  <h2>SubMatch</h2>
  <p data-i18n="desc">Click any subtitle word while watching a video to translate and save it.</p>

  <button id="openWebBtn" class="btn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2 2 7l10 5 10-5-10-5z"/>
      <path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>
    </svg>
    <span data-i18n="myCards">My Flashcards</span>
  </button>

  <div class="divider"></div>

  <div class="settings">
    <div class="setting-row">
      <span data-i18n="theme">Theme</span>
      <select id="themeSelect">
        <option value="auto" data-i18n="sysOpt">System</option>
        <option value="dark" data-i18n="darkOpt">Dark</option>
        <option value="light" data-i18n="lightOpt">Light</option>
      </select>
    </div>
    <div class="setting-row">
      <span data-i18n="font">Font</span>
      <select id="fontSelect">
        <option value="system" data-i18n="fontSysOpt">System</option>
        <option value="sans">Sans-serif</option>
        <option value="serif">Serif</option>
        <option value="mono">Monospace</option>
      </select>
    </div>
    <div class="setting-row">
      <span data-i18n="underline">Underlines</span>
      <select id="underlineSelect">
        <option value="on" data-i18n="onOpt">On</option>
        <option value="off" data-i18n="offOpt">Off</option>
      </select>
    </div>
  </div>

  <p class="hint"><span data-i18n="hint">Works on YouTube, Netflix, Disney+, Amazon Prime &amp; more.</span></p>

  <script src="popup.js"></script>
</body>
</html>
