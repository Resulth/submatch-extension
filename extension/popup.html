<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SubMatch</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #141414;
      --text: #F1F1F1;
      --text-muted: #888;
      --text-hint: #555;
      --border: rgba(255,255,255,0.07);
      --btn-bg: #F1F1F1;
      --btn-text: #0F0F0F;
      --btn-hover: #D8D8D8;
      --select-bg: #222;
      --select-border: #333;
    }

    body.light-mode {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666;
      --text-hint: #999;
      --border: rgba(0,0,0,0.1);
      --btn-bg: #1a1a1a;
      --btn-text: #ffffff;
      --btn-hover: #333333;
      --select-bg: #f5f5f5;
      --select-border: #ddd;
    }

    body {
      width: 260px;
      padding: 24px 20px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
      transition: background-color 0.2s, color 0.2s;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      margin-bottom: 14px;
      object-fit: contain;
    }

    h2 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 7px;
    }

    p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 22px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      transition: background-color 0.15s ease, transform 0.1s ease;
      letter-spacing: 0.01em;
      margin-bottom: 16px;
    }

    .btn:hover {
      background-color: var(--btn-hover);
      transform: translateY(-1px);
    }

    .settings {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    select {
      background: var(--select-bg);
      color: var(--text);
      border: 1px solid var(--select-border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }

    .hint {
      font-size: 11px;
      color: var(--text-hint);
      margin-top: 16px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <img src="icons/icon48.png" class="logo" alt="SubMatch" />

  <h2>SubMatch</h2>
  <p>Click any subtitle word while watching a video to translate and save it.</p>

  <button id="openWebBtn" class="btn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M2 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6z"/>
      <path d="M6 2h12a2 2 0 0 1 2 2v12" opacity="0.35"/>
    </svg>
    My Flashcards
  </button>

  <div class="divider"></div>

  <div class="settings">
    <div class="setting-row">
      <span>Theme</span>
      <select id="themeSelect">
        <option value="auto">System</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
    <div class="setting-row">
      <span>Font</span>
      <select id="fontSelect">
        <option value="system">System</option>
        <option value="sans">Sans-serif</option>
        <option value="serif">Serif</option>
        <option value="mono">Monospace</option>
      </select>
    </div>
    <div class="setting-row">
      <span>Underlines</span>
      <select id="underlineSelect">
        <option value="on">On</option>
        <option value="off">Off</option>
      </select>
    </div>
  </div>

  <p class="hint">Works on YouTube, Netflix, Disney+, Amazon Prime &amp; more.</p>

  <script src="popup.js"></script>
</body>
</html>
